<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Dark Theme</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
            position: relative;
        }

        .avatar {
            width: 60px;
            height: 60px;
            background: #312e81;
            color: #818cf8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 24px;
            border: 1px solid #4338ca;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 12px;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #6366f1;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #4f46e5;
        }

        .btn-secondary {
            background-color: #334155;
            color: #cbd5e1;
        }

        .btn-secondary:hover {
            background-color: #475569;
            color: #f8fafc;
        }

        .details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, margin-top 0.3s ease;
            font-size: 13px;
            color: #94a3b8;
            background: #0f172a;
            border-radius: 8px;
            text-align: left;
            padding: 0 16px;
        }

        .details.open {
            max-height: 100px;
            padding: 12px 16px;
            margin-top: 20px;
            border: 1px solid #1e293b;
        }

        .toast {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: #022c22;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            bottom: -40px;
            opacity: 1;
        }
    </style>
</head>
<body>

    <main class="card">
        <div class="avatar">✦</div>
        <h1>Simple & Dark</h1>
        <p>A minimal page redesigned with a dark color palette. Lightweight, fast, and easy to read.</p>
        
        <div class="actions">
            <button class="btn btn-primary" onclick="showToast()">Get Started</button>
            <button class="btn btn-secondary" onclick="toggleDetails()">Learn More</button>
        </div>

        <div id="detailsBox" class="details">
            ✨ This page runs on standard CSS and HTML with zero heavy dependencies!
        </div>

        <div id="toast" class="toast">🚀 Ready to start!</div>
    </main>

    <script>
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function toggleDetails() {
            const details = document.getElementById('detailsBox');
            details.classList.toggle('open');
        }
    </script>

</body>
</html>
